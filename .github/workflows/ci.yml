name: Node CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t node-app:latest .

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker image
        run: docker tag node-app:latest ${{ secrets.DOCKER_USERNAME }}/node-app:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/node-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy simulation
        run: |
          echo "Simulating deployment..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:latest
          docker stop node-app || true
          docker rm node-app || true
          docker run -d -p 4000:3000 --name node-app ${{ secrets.DOCKER_USERNAME }}/node-app:latest

